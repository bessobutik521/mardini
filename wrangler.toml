name = "mardini"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

[assets]
  directory = "dist"
  branch = "main"
  src = "dist/**

[env.production]
  # These secrets are set in Cloudflare dashboard, NOT in code or GitHub
  SUPABASE_URL = ""
  SUPABASE_SERVICE_ROLE_KEY = ""
  SUPABASE_ANON_KEY = ""
  SUPABASE_STORAGE_BUCKET = "proofs"

[env.development]
  # Optional dev variables
  SUPABASE_URL = ""
  SUPABASE_SERVICE_ROLE_KEY = ""
  SUPABASE_ANON_KEY = ""
  SUPABASE_STORAGE_BUCKET = "proofs"