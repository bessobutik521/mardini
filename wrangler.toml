name = "mardini"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "mardini_analytics"

[env.production]
  # These secrets are set in Cloudflare dashboard, NOT in code or GitHub
  SUPABASE_URL = ""
  SUPABASE_SERVICE_ROLE_KEY = ""
  SUPABASE_ANON_KEY = ""
  SUPABASE_STORAGE_BUCKET = "proofs"

[env.development]
  # Optional dev variables
  SUPABASE_URL = ""
  SUPABASE_SERVICE_ROLE_KEY = ""
  SUPABASE_ANON_KEY = ""
  SUPABASE_STORAGE_BUCKET = "proofs"